<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>RoadIQ — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; background: #0b0b0c; color: #f5f1e8; }
      main { min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); text-align: center; }
      section { width: min(100%, 390px); }
      .mark { display: grid; width: 52px; height: 52px; margin: 0 auto 28px; place-items: center; border-radius: 15px; background: #ff6846; color: #231713; font-size: 13px; font-weight: 800; }
      h1 { margin: 0; font-size: clamp(34px, 10vw, 48px); line-height: .98; letter-spacing: -.055em; }
      p { margin: 20px auto 0; color: #aaa49b; font-size: 16px; line-height: 1.65; }
      a { display: inline-flex; min-height: 48px; margin-top: 30px; align-items: center; justify-content: center; border-radius: 999px; background: #ff6846; padding: 0 24px; color: #231713; font-weight: 750; text-decoration: none; }
      a:focus-visible { outline: 3px solid #ff8b70; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="mark" aria-hidden="true">RQ</div>
        <h1>You are offline</h1>
        <p>RoadIQ needs a connection to load challenges and validate new answers. Your saved progress is safe on this device.</p>
        <a href="/">Try again</a>
      </section>
    </main>
  </body>
</html>
